name: SaaS release

on:
  pull_request:
    branches: [feat/saas]
  push:
    branches: [feat/saas]
  workflow_dispatch:

concurrency:
  group: saas-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy:
    name: Publish to Lighthouse
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIGHTHOUSE_HOST: 43.165.190.11
      LIGHTHOUSE_USER: ubuntu
    steps:
      - uses: actions/checkout@v5

      - name: Check the deploy key
        id: key
        env:
          SSH_KEY: ${{ secrets.LIGHTHOUSE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "::notice::LIGHTHOUSE_SSH_KEY is unset, so this push was not published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lighthouse
          chmod 600 ~/.ssh/lighthouse
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build release image
        if: steps.key.outputs.ready == 'true'
        run: docker build --tag openmaic:release .

      - name: Publish the image
        if: steps.key.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ssh-keyscan -H "$LIGHTHOUSE_HOST" >> ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/lighthouse -o IdentitiesOnly=yes -o ServerAliveInterval=30)
          target="$LIGHTHOUSE_USER@$LIGHTHOUSE_HOST"
          ssh "${ssh_opts[@]}" "$target" 'test -s /opt/mingke/env && docker info >/dev/null && sudo install -d -m 755 -o ubuntu -g ubuntu /opt/mingke'
          scp "${ssh_opts[@]}" deploy/lighthouse-compose.yml "$target:/opt/mingke/compose.yml"
          scp "${ssh_opts[@]}" scripts/lighthouse-up.sh "$target:/opt/mingke/up.sh"
          docker save openmaic:release | gzip | ssh "${ssh_opts[@]}" "$target" 'gunzip | docker load'
          ssh "${ssh_opts[@]}" "$target" 'bash /opt/mingke/up.sh'
