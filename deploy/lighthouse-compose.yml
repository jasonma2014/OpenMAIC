# Published by GitHub Actions. Runtime secrets stay in /opt/mingke/env on the server.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: openmaic
      POSTGRES_USER: openmaic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openmaic -d openmaic']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - mingke-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  openmaic:
    image: openmaic:release
    ports:
      - '80:3000'
    env_file:
      - /opt/mingke/env
    environment:
      OPENMAIC_SAAS_ENABLED: 'true'
      DATABASE_URL: postgresql://openmaic:${POSTGRES_PASSWORD}@postgres:5432/openmaic
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mingke-postgres:
